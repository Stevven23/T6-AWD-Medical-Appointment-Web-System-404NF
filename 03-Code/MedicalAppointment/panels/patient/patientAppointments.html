<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - Clínica San Miguel</title>
    <link rel="stylesheet" href="../../css/mainStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="../../sources/img/logo.png" alt="Clínica San Miguel Logo">
                </div>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="patientDashboard.html"><i class="fas fa-home"></i> Inicio</a></li>
                    <li class="active"><a href="patientAppointments.html"><i class="fas fa-calendar-check"></i> Mis Citas</a></li>
                    <li><a href="patientHistory.html"><i class="fas fa-file-medical"></i> Historial Médico</a></li>
                    <li><a href="patientPrescriptions.html"><i class="fas fa-pills"></i> Recetas</a></li>
                    <li><a href="patientLab.html"><i class="fas fa-flask"></i> Resultados de Laboratorio</a></li>
                    <li><a href="patientProfile.html"><i class="fas fa-user-cog"></i> Mi Perfil</a></li>
                    <li><a href="patientMessages.html"><i class="fas fa-envelope"></i> Mensajes</a></li>
                    <li><a href="../../../MedicalAppointment/index.html"><i class="fas fa-sign-out-alt"></i> Cerrar Sesion</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Mis Citas</h1>
                <div class="user-profile">
                    <span>Carlos Mendoza</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <section class="appointments-section">
                <button class="btn-primary"><i class="fas fa-plus"></i> Nueva Cita</button>
                
                <div class="tabs">
                    <button class="tab-btn active">Próximas</button>
                    <button class="tab-btn">Pasadas</button>
                    <button class="tab-btn">Canceladas</button>
                </div>

                <div class="appointments-list" id="appointmentsListContainer">
                    <!-- Las citas se renderizan dinámicamente aquí -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para agregar/editar cita -->
    <div id="appointmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-plus"></i> Nueva Cita</h2>
                <span class="close" onclick="closeAppointmentModal()">&times;</span>
            </div>
            <form id="appointmentForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="appointmentDoctor">Doctor *</label>
                        <select id="appointmentDoctor" required>
                            <option value="">Seleccione un doctor</option>
                            <option value="Dr. Sofia Pérez">Dr. Sofia Pérez</option>
                            <option value="Dr. Juan Martínez">Dr. Juan Martínez</option>
                            <option value="Dra. Ana López">Dra. Ana López</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="appointmentSpecialty">Especialidad *</label>
                        <select id="appointmentSpecialty" required>
                            <option value="">Seleccione especialidad</option>
                            <option value="Cardiología">Cardiología</option>
                            <option value="Medicina General">Medicina General</option>
                            <option value="Oftalmología">Oftalmología</option>
                            <option value="Pediatría">Pediatría</option>
                            <option value="Dermatología">Dermatología</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="appointmentDate">Fecha *</label>
                        <input type="date" id="appointmentDate" required>
                    </div>

                    <div class="form-group">
                        <label for="appointmentTime">Hora *</label>
                        <input type="time" id="appointmentTime" required>
                    </div>

                    <div class="form-group">
                        <label for="appointmentReason">Motivo de la consulta *</label>
                        <textarea id="appointmentReason" rows="3" required placeholder="Describa el motivo de su consulta"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeAppointmentModal()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-check"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal">
            <div class="modal-header">
                <h2>Confirmar Acción</h2>
                <span class="close" onclick="closeConfirmModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeConfirmModal()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" id="confirmButton" class="btn-danger">
                    <i class="fas fa-check"></i> Confirmar
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/appointmentManager.js"></script>
    <script src="../../js/notificationManager.js"></script>
</body>

</html>
